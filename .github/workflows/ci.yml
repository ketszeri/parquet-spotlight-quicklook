name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Build importer, Quick Look extension, and app
        run: ./scripts/build.sh

      - name: Run script, core, and row-preview tests
        run: ./scripts/test_scripts.sh

      - name: Host the Quick Look view controller
        run: ./scripts/test_preview_host.sh

      - name: Package DMG and zip
        run: ./scripts/package_ci.sh

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Parquet-Spotlight-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.sha256
            release/size-report.txt
            build/size-report.txt
