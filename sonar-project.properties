# Fork-only SonarQube Cloud configuration for ketszeri/parquet-spotlight-quicklook.
# Keep this file out of pull requests to the upstream repository.

sonar.organization=ketszeri
sonar.projectKey=ketszeri_parquet-spotlight-quicklook
sonar.projectName=parquet-spotlight-quicklook
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Objective-C is not analyzed in AutoConfig or Automatic Analysis mode.
# The workflow generates this database with Build Wrapper on macOS.
sonar.cfamily.compile-commands=bw-output/compile_commands.json

# Do not fail the workflow when the quality gate fails. Ratings are reported
# from the SonarQube Cloud API; issues are left for a later change.
sonar.qualitygate.wait=false

# Directories that exist on main. Tests are not also listed under sources.
# The workflow appends native when that crate is in the checkout.
sonar.sources=src,preview,Sources,scripts,plist,resources,.github
sonar.tests=Tests

# Vendored, generated, and build output. Cargo.lock is a lockfile, not source.
# The workflow appends Rust properties when native/parquet_preview exists.
sonar.exclusions=build/**,release/**,bw-output/**,**/target/**,fixtures/**,licenses/**,**/*.icns,**/*.parquet,**/Cargo.lock,**/.cargo/**
