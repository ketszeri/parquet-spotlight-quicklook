# Fork-only SonarQube Cloud configuration for ketszeri/parquet-spotlight-quicklook.
# Keep this file out of pull requests to the upstream repository.

sonar.organization=ketszeri
sonar.projectKey=ketszeri_parquet-spotlight-quicklook
sonar.projectName=parquet-spotlight-quicklook
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Objective-C is not analyzed in AutoConfig or Automatic Analysis mode.
# The workflow generates this database with Build Wrapper on macOS.
sonar.cfamily.compile-commands=bw-output/compile_commands.json

# The GitHub check waits for the quality gate. Coverage is produced by
# scripts/sonar_coverage.sh: Rust LCOV, Swift llvm-cov show, and generic XML.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# Directories that exist on main. Tests are not also listed under sources.
# The workflow appends native when that crate is in the checkout.
sonar.sources=src,preview,Sources,scripts,plist,resources,.github
sonar.tests=Tests

# Vendored, generated, and build output. Cargo.lock is a lockfile, not source.
# native/parquet_preview/src/bin is the fixture generator; it is not linked
# into the app or the tests. native/parquet_preview/tests is Rust test code.
# Swift tests already live under sonar.tests. Product sources, including the
# preview controller and the C ABI, stay in the analysis.
# The workflow appends Rust and coverage properties when the reports exist.
sonar.exclusions=build/**,release/**,bw-output/**,**/target/**,fixtures/**,licenses/**,**/*.icns,**/*.parquet,**/Cargo.lock,**/.cargo/**,native/parquet_preview/src/bin/**,native/parquet_preview/tests/**
